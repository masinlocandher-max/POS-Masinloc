name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Verify protected staging output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          grep -q 'Disallow: /' dist/robots.txt
          grep -q 'noindex' dist/index.html

      - name: Upload production candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: pos-production-dist
          path: dist
          if-no-files-found: error
